name: Update endpoint
# build: compile the self-hosted endpoint server (server/) for Linux; download the artifact and
#        install it as described in server/README.md.
# rules: convert the latest v2fly geosite/geoip data plus config/rules-extra.json and publish it as a
#        remote rule update (also weekly, and whenever rules-extra.json changes on main).
on:
  push:
    branches: [main]
    paths: ['config/rules-extra.json']
  workflow_dispatch:
    inputs:
      action: { description: 'build or rules', type: choice, options: [build, rules], default: build }
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'build'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: server/go.sum
      - name: Build
        working-directory: server
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' -o ../work/v2board-endpoint-linux-$arch .
          done
          cp deploy/* ../work/
      - uses: actions/upload-artifact@v4
        with:
          name: v2board-endpoint
          path: work/
  rules:
    if: (github.event_name != 'workflow_dispatch' && vars.UPDATE_ENDPOINT != '') || (github.event_name == 'workflow_dispatch' && inputs.action == 'rules')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Convert
        run: |
          python3 tools/import-rules.py latest rules.json config/rules-extra.json | tee stats.json
          echo "SHA=$(sha256sum rules.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "BYTES=$(stat -c %s rules.json)" >> "$GITHUB_ENV"
      - name: Publish
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ENDPOINTS: ${{ vars.UPDATE_ENDPOINT }}
        run: |
          ENDPOINT=$(echo "$ENDPOINTS" | tr ', ' '\n\n' | grep -m1 .) || true
          if [ -z "$SIGNING_KEY" ] || [ -z "$ENDPOINT" ]; then
            echo "::warning::Update endpoint not configured (secrets.SIGNING_KEY, vars.UPDATE_ENDPOINT); rules converted and validated but not published."
            exit 0
          fi
          ADMIN_TOKEN=$(node tools/admin-token.mjs)
          key="rules/${SHA:0:16}/rules.json"
          curl --fail-with-body -sS -X POST -T rules.json -H "Authorization: Bearer $ADMIN_TOKEN" "${ENDPOINT%/}/admin/upload?key=$key"
          curl --fail-with-body -sS -X POST "${ENDPOINT%/}/admin/rules" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' \
            --data "{\"key\":\"$key\",\"sha256\":\"$SHA\",\"bytes\":$BYTES}"
