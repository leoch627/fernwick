name: Update endpoint
# deploy: create the R2 bucket if needed, deploy server/ and install SIGNING_KEY from GitHub Secrets.
# rules:  convert the latest Loyalsoldier/clash-rules data and publish it as a remote rule update (also weekly).
on:
  workflow_dispatch:
    inputs:
      action: { description: 'deploy or rules', type: choice, options: [deploy, rules], default: deploy }
      rules_ref: { description: 'clash-rules ref for "rules" (branch, tag or commit)', type: string, default: release }
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BUCKET: ${{ vars.R2_BUCKET || 'v2board-client-files' }}
  WRANGLER: npx --yes wrangler@4.151.1
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bucket
        run: $WRANGLER r2 bucket create "$BUCKET" || echo "Bucket $BUCKET already exists"
      - name: Deploy
        working-directory: server
        run: |
          args=(--var "PUBLIC_ORIGIN:${{ vars.UPDATE_ENDPOINT }}")
          if [ "$BUCKET" != v2board-client-files ]; then sed -i "s/\"v2board-client-files\"/\"$BUCKET\"/" wrangler.jsonc; fi
          $WRANGLER deploy "${args[@]}"
      - name: Signing key
        working-directory: server
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "::error::GitHub secret SIGNING_KEY is missing"; exit 1; fi
          printf '%s' "$SIGNING_KEY" | $WRANGLER secret put SIGNING_KEY
  rules:
    if: (github.event_name == 'schedule' && vars.UPDATE_ENDPOINT != '') || (github.event_name == 'workflow_dispatch' && inputs.action == 'rules')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Convert
        env:
          REF: ${{ inputs.rules_ref || 'release' }}
        run: |
          base="https://raw.githubusercontent.com/Loyalsoldier/clash-rules/$REF"
          curl --fail -sSL -o direct.txt "$base/direct.txt"
          curl --fail -sSL -o cncidr.txt "$base/cncidr.txt"
          python3 tools/import-rules.py --convert direct.txt cncidr.txt rules.json | tee stats.json
          echo "SHA=$(sha256sum rules.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "BYTES=$(stat -c %s rules.json)" >> "$GITHUB_ENV"
      - name: Publish
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ENDPOINT: ${{ vars.UPDATE_ENDPOINT }}
        run: |
          ADMIN_TOKEN=$(node --no-warnings --input-type=module -e "const { adminToken } = await import('./server/src/signing.ts'); process.stdout.write(await adminToken(process.env.SIGNING_KEY))")
          key="rules/${SHA:0:16}/rules.json"
          $WRANGLER r2 object put "$BUCKET/$key" --file rules.json --content-type application/json --remote
          curl --fail-with-body -sS -X POST "${ENDPOINT%/}/admin/rules" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' \
            --data "{\"key\":\"$key\",\"sha256\":\"$SHA\",\"bytes\":$BYTES}"
