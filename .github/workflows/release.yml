name: Release
# Push a tag matching package.json, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
  check:
    needs: version
    uses: ./.github/workflows/check.yml
  package:
    needs: check
    uses: ./.github/workflows/package-development.yml
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: starrail-development-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        # GitHub rewrites spaces in asset names, so rename first to keep SHA256SUMS accurate.
        run: |
          shopt -s nullglob
          for f in *' '*; do mv -- "$f" "${f// /-}"; done
          sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          Development build of StarRail Network (test channel). Not production-signed and not yet runtime-tested on real devices.

          | Platform | File |
          | --- | --- |
          | Windows 11 x64 | `*-win-x64.exe` |
          | macOS 14+ Apple Silicon | `*-mac-arm64.dmg` (or `.zip`) |
          | macOS 14+ Intel | `*-mac-x64.dmg` (or `.zip`) |
          | Ubuntu 24.04 x64 | `*-linux-amd64.deb` |

          - Windows: SmartScreen will warn about an unknown publisher; choose "More info" → "Run anyway".
          - macOS: the app is not notarized. After moving it to /Applications, run `xattr -dr com.apple.quarantine "/Applications/StarRail Network Dev.app"` before the first launch.
          - Linux: `sudo apt install ./<file>.deb`.

          Verify downloads against `SHA256SUMS.txt`.
          EOF
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "StarRail Network $GITHUB_REF_NAME (development)" --notes-file notes.md --prerelease --verify-tag
