name: Release
# Tag push (git tag v0.2.0 && git push origin v0.2.0): build the brand from repository variables,
# publish a GitHub Release, upload the installers to the self-hosted endpoint and register the version.
# Manual run: optionally override name/API for a one-off build; publishing to the endpoint is opt-in.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      brand_name: { description: '机场名称 (default vars.BRAND_NAME)', type: string, required: false }
      brand_id: { description: 'Stable ID (default vars.BRAND_ID)', type: string, required: false }
      api_primary: { description: '主 API (default vars.BRAND_API_PRIMARY)', type: string, required: false }
      api_backup: { description: '备用 API (default vars.BRAND_API_BACKUP)', type: string, required: false }
      website: { description: '官网 (default vars.BRAND_WEBSITE)', type: string, required: false }
      publish_endpoint: { description: 'Push this build to the update endpoint (clients will update)', type: boolean, default: false }
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version from package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  check:
    needs: version
    uses: ./.github/workflows/check.yml
  package:
    needs: check
    uses: ./.github/workflows/package-development.yml
    with:
      production: true
      brand_name: ${{ inputs.brand_name }}
      brand_id: ${{ inputs.brand_id }}
      api_primary: ${{ inputs.api_primary }}
      api_backup: ${{ inputs.api_backup }}
      website: ${{ inputs.website }}
    secrets:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  publish:
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          ls -l
          sha256sum -- *.exe *.dmg *.zip *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          name=$(node -p "require('./release/build-config.json').name")
          cat > notes.md <<EOF
          ${name} ${VERSION}

          | 系统 | 文件 |
          | --- | --- |
          | Windows 11 x64 | \`*-windows-x64.exe\` |
          | macOS 14+ Apple 芯片 | \`*-macos-arm64.dmg\` |
          | macOS 14+ Intel | \`*-macos-x64.dmg\` |
          | Ubuntu 24.04 x64 | \`*-linux-amd64.deb\` |

          安装包未做平台代码签名：Windows 首次运行点“更多信息 → 仍要运行”；macOS 拖入“应用程序”后执行
          \`xattr -dr com.apple.quarantine "/Applications/${name}.app"\`。可用 SHA256SUMS.txt 校验下载。
          EOF
      - name: GitHub Release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.exe release/*.dmg release/*.zip release/*.deb release/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" release/*.exe release/*.dmg release/*.zip release/*.deb release/SHA256SUMS.txt \
              --title "$(node -p "require('./release/build-config.json').name") $tag" --notes-file notes.md --target "$GITHUB_SHA"
          fi
      - name: Upload to the update endpoint and register the release
        if: github.event_name == 'push' || inputs.publish_endpoint
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ENDPOINTS: ${{ vars.UPDATE_ENDPOINT }}
        run: |
          # The first UPDATE_ENDPOINT is the server; further ones are mirror domains of it.
          ENDPOINT=$(echo "$ENDPOINTS" | tr ', ' '\n\n' | grep -m1 .) || true
          if [ -z "$SIGNING_KEY" ] || [ -z "$ENDPOINT" ]; then
            echo "::warning::Update endpoint not configured (secrets.SIGNING_KEY, vars.UPDATE_ENDPOINT); skipped."
            exit 0
          fi
          ADMIN_TOKEN=$(node tools/admin-token.mjs)
          for f in release/*.exe release/*.dmg release/*.zip release/*.deb; do
            curl --fail-with-body -sS -X POST -T "$f" -H "Authorization: Bearer $ADMIN_TOKEN" \
              "${ENDPOINT%/}/admin/upload?key=releases/$VERSION/$(basename "$f")"
          done
          node tools/release-assets.mjs payload "$VERSION" > payload.json
          curl --fail-with-body -sS -X POST "${ENDPOINT%/}/admin/release" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' --data-binary @payload.json
