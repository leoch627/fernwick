name: Build development installers (no runtime tests)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            package: --linux deb --x64
          - os: windows-2025
            target: win32-x64
            package: --win nsis --x64
          - os: macos-15
            target: darwin-arm64
            package: --mac dmg zip --arm64
          - os: macos-15-intel
            target: darwin-x64
            package: --mac dmg zip --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/helper/go.sum
      - run: npm ci
      - run: python3 tools/fetch-core.py ${{ matrix.target }}
      - run: python3 tools/build-native.py --target ${{ matrix.target }}
      - run: npm run build
      - run: npx electron-builder --config electron-builder.cjs ${{ matrix.package }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: starrail-development-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
