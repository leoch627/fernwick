name: Build installers
# Manual runs build the development configuration unless "production" is ticked.
# Production builds take the brand from repository variables (BRAND_*, UPDATE_ENDPOINT) and the public half of secrets.SIGNING_KEY;
# any input below overrides the matching variable. See README "发布".
on:
  workflow_dispatch:
    inputs:
      production: { description: 'Build with the brand configuration', type: boolean, default: false }
      brand_name: { description: '机场名称 (overrides vars.BRAND_NAME)', type: string, required: false }
      brand_id: { description: 'Stable ID, a-z 0-9 - (overrides vars.BRAND_ID)', type: string, required: false }
      api_primary: { description: '主 API (overrides vars.BRAND_API_PRIMARY)', type: string, required: false }
      api_backup: { description: '备用 API (overrides vars.BRAND_API_BACKUP)', type: string, required: false }
      website: { description: '官网 (overrides vars.BRAND_WEBSITE)', type: string, required: false }
  workflow_call:
    inputs:
      production: { type: boolean, default: false }
      brand_name: { type: string, required: false }
      brand_id: { type: string, required: false }
      api_primary: { type: string, required: false }
      api_backup: { type: string, required: false }
      website: { type: string, required: false }
    secrets:
      SIGNING_KEY: { required: false }
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: win32-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    env:
      # Windows Python otherwise reads files with the ANSI code page.
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            native/helper/go.sum
            desktop/go.sum
      # Hosted Windows images have no python3 on PATH; setup-python provides `python` everywhere.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      # Lays out the DMG window (background, icon positions) without scripting Finder.
      - name: macOS disk image builder
        if: runner.os == 'macOS'
        run: python -m pip install dmgbuild==1.6.7
      # The embedded public key comes from the Worker's own private key, so the two cannot drift apart.
      # Runs before npm ci so no installed package shares a step with the secret.
      - name: Public key
        if: inputs.production
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "::error::GitHub secret SIGNING_KEY is missing"; exit 1; fi
          {
            echo 'BRAND_PUBLIC_KEY<<PEM'
            node -e "process.stdout.write(require('node:crypto').createPublicKey(process.env.SIGNING_KEY).export({ type: 'spki', format: 'pem' }))"
            echo PEM
          } >> "$GITHUB_ENV"
      - run: npm ci
      - name: Brand configuration
        if: inputs.production
        env:
          BRAND_NAME: ${{ inputs.brand_name || vars.BRAND_NAME }}
          BRAND_ID: ${{ inputs.brand_id || vars.BRAND_ID }}
          BRAND_APP_ID: ${{ vars.BRAND_APP_ID }}
          BRAND_API_PRIMARY: ${{ inputs.api_primary || vars.BRAND_API_PRIMARY }}
          BRAND_API_BACKUP: ${{ inputs.api_backup || vars.BRAND_API_BACKUP }}
          BRAND_WEBSITE: ${{ inputs.website || vars.BRAND_WEBSITE }}
          BRAND_SUBSCRIPTION_ORIGINS: ${{ vars.BRAND_SUBSCRIPTION_ORIGINS }}
          BRAND_ENDPOINT: ${{ vars.UPDATE_ENDPOINT }}
          BRAND_DOWNLOADS: ${{ vars.DOWNLOAD_ENDPOINT }}
        run: |
          npm run brand -- --out work/build-config.json
          echo "STARRAIL_BUILD_CONFIG=work/build-config.json" >> "$GITHUB_ENV"
      - run: python tools/fetch-core.py ${{ matrix.target }}
      - run: python tools/build-native.py --target ${{ matrix.target }}
      - run: npm run build
      - run: python tools/package.py --target ${{ matrix.target }} --skip-ui
      - name: Verify packaged resources
        run: |
          case '${{ matrix.target }}' in
            linux-x64) directory=linux-unpacked ;;
            win32-x64) directory=win-unpacked ;;
            darwin-arm64) directory=mac-arm64 ;;
            darwin-x64) directory=mac ;;
          esac
          python tools/verify-package.py "release/$directory" --target '${{ matrix.target }}'
      - name: Name installers and record metadata
        run: node tools/release-assets.mjs manifest ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
            release/manifest-*.json
            release/build-config.json
